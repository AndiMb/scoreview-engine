name: Build

on:
  push:
  pull_request:
  # For musescore-release.yml. A branch pushed with GITHUB_TOKEN starts
  # no workflow, but workflow_dispatch is exempt from that brake, so the
  # bot can still get its draft pull request a build - and that build,
  # naming every drifted file, is the whole point of the draft.
  workflow_dispatch:

# Read-only by default; the one job that needs more says so itself. Without
# this block every job here runs with whatever the repository's default
# happens to be, which for an older repository is read/write on everything --
# on a workflow that builds pull requests from forks.
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: Shadow drift guard
        run: tools/check-shadow-drift.sh

      # Offline, sub-second: every version in tools/deps.json must match what
      # the tree actually builds. Without this the inventory — and the weekly
      # update check that reads it — drifts out of date unnoticed.
      - name: Dependency manifest
        run: python3 tools/check-deps.py --verify

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-10 cmake ninja-build zlib1g-dev

      - name: Pre-seed HarfBuzz
        run: |
          mkdir -p build/_deps/harfbuzz
          cp prefetch/* build/_deps/harfbuzz/
          cd build/_deps/harfbuzz && cmake -E tar xf harfbuzz_src.7z

      - name: Configure and build
        env:
          CC: gcc-10
          CXX: g++-10
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Debug
          ninja -C build

      # Half a second, and the only coverage some of this code has. The corpus
      # gate is an end-to-end comparison over whatever the 570 vtest scores
      # happen to contain, and none of them carries a picture -- so the header
      # probe, the one loop here that walks attacker-shaped bytes, is checked
      # nowhere else. Cheap and specific, so it runs before the slow gates.
      - name: Unit tests
        run: build/sve_tests

      - name: Convert test score
        run: |
          build/mscz2media testdata/repeat-test.mscz --resources resources --out build/out --drawdata --midi --spos --mpos --meta --svg
          test -s build/out/page-1.drawdata.json
          test -s build/out/page-1.svg

      # The corpus carries no score with a picture, so nothing else here would
      # notice if embedded images stopped working - and they used to take the
      # whole load down, not just the picture.
      - name: Convert test score with embedded images
        run: |
          build/mscz2media testdata/image-test.mscz --resources resources --out build/out-images --svg
          grep -q 'xlink:href="data:image/png;base64,' build/out-images/page-1.svg
          grep -q 'xlink:href="data:image/jpeg;base64,' build/out-images/page-1.svg

      # The corpus gate: fingerprints of MIDI, spos/mpos and metadata for all
      # vtest scores must match the released Qt webmscore (baseline in
      # testdata/). "tracks" is allowed to differ — this build has no audio,
      # so the metadata track list is always empty.
      - name: Corpus
        run: |
          python3 tools/corpus-native.py --bin build/mscz2media --resources resources \
            --scores musescore/vtest/scores --out build/corpus-native.json --with-svg
          python3 tools/corpus-compare.py testdata/corpus-baseline.json build/corpus-native.json \
            --allow-meta tracks --waivers testdata/corpus-waivers.json

      - name: Upload native corpus report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: corpus-native
          path: build/corpus-native.json

  # The wasm gate: the wasm build must reproduce the native fingerprints
  # exactly (same loader, same writers — any diff is a wasm-side bug).
  wasm:
    runs-on: ubuntu-24.04
    needs: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: Pre-seed HarfBuzz
        run: |
          mkdir -p build-wasm/_deps/harfbuzz
          cp prefetch/* build-wasm/_deps/harfbuzz/
          cd build-wasm/_deps/harfbuzz && cmake -E tar xf harfbuzz_src.7z

      # Plain docker run rather than a third-party action: this is one command,
      # and addnab/docker-run-action — which used to wrap it — has had no
      # release since 2021 and was referenced by a moving tag, with the
      # workspace mounted into it. Same invocation as tools/build-wasm-docker.sh.
      - name: Build wasm
        env:
          # Through the environment rather than an expression pasted into the
          # shell. The value is GitHub's own and harmless, but a `run:` body is
          # not the place to learn that the hard way -- see the note at the top
          # of musescore-release.yml.
          WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm -v "$WORKSPACE:/src" emscripten/emsdk:6.0.9 bash -c '
            set -e
            emcmake cmake -S /src -B /src/build-wasm -DCMAKE_BUILD_TYPE=Release
            cmake --build /src/build-wasm --target scoreview -- -j "$(nproc)"
            cp /src/build-wasm/scoreview.lib.js /src/build-wasm/scoreview.lib.wasm /src/build-wasm/scoreview.lib.data /src/web-public/
          '

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Bundle JS wrapper
        working-directory: web-public
        run: |
          npm ci
          npm run build

      - name: Download native corpus report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: corpus-native

      - name: Corpus under Node
        run: |
          node tools/corpus-node.cjs --out corpus-node.json
          python3 tools/corpus-compare.py corpus-native.json corpus-node.json --exact-svg \
            --waivers testdata/corpus-wasm-waivers.json

      - name: Pack npm tarball
        working-directory: web-public
        run: npm pack

      - name: Upload npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-pack
          path: web-public/scoreview-engine-*.tgz

  # Distribution through GitHub Releases only (like the webmscore fork):
  # a push to main whose commit message starts with "release v<tag>" creates
  # the release and attaches the corpus-gated tarball from this same run.
  publish:
    if: github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'release v')
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download npm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-pack

      - name: Version from commit message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | head -1 | cut -d ' ' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: scoreview-engine-*.tgz
          name: scoreview-engine ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
