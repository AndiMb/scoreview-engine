name: Build

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Shadow drift guard
        run: tools/check-shadow-drift.sh

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-10 cmake ninja-build zlib1g-dev

      - name: Pre-seed HarfBuzz
        run: |
          mkdir -p build/_deps/harfbuzz
          cp prefetch/* build/_deps/harfbuzz/
          cd build/_deps/harfbuzz && cmake -E tar xf harfbuzz_src.7z

      - name: Configure and build
        env:
          CC: gcc-10
          CXX: g++-10
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Debug
          ninja -C build

      - name: Convert test score
        run: |
          build/mscz2media testdata/repeat-test.mscz --resources resources --out build/out --drawdata --midi --spos --mpos --meta --svg
          test -s build/out/page-1.drawdata.json
          test -s build/out/page-1.svg

      # The corpus gate: fingerprints of MIDI, spos/mpos and metadata for all
      # vtest scores must match the released Qt webmscore (baseline in
      # testdata/). "tracks" is allowed to differ — this build has no audio,
      # so the metadata track list is always empty.
      - name: Corpus
        run: |
          python3 tools/corpus-native.py --bin build/mscz2media --resources resources \
            --scores musescore/vtest/scores --out build/corpus-native.json --with-svg
          python3 tools/corpus-compare.py testdata/corpus-baseline.json build/corpus-native.json \
            --allow-meta tracks --waivers testdata/corpus-waivers.json

      - name: Upload native corpus report
        uses: actions/upload-artifact@v4
        with:
          name: corpus-native
          path: build/corpus-native.json

  # The wasm gate: the wasm build must reproduce the native fingerprints
  # exactly (same loader, same writers — any diff is a wasm-side bug).
  wasm:
    runs-on: ubuntu-22.04
    needs: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pre-seed HarfBuzz
        run: |
          mkdir -p build-wasm/_deps/harfbuzz
          cp prefetch/* build-wasm/_deps/harfbuzz/
          cd build-wasm/_deps/harfbuzz && cmake -E tar xf harfbuzz_src.7z

      - name: Build wasm
        uses: addnab/docker-run-action@v3
        with:
          image: emscripten/emsdk:4.0.7
          options: -v ${{ github.workspace }}:/src
          run: |
            emcmake cmake -S /src -B /src/build-wasm -DCMAKE_BUILD_TYPE=Release
            cmake --build /src/build-wasm --target scoreview -- -j "$(nproc)"
            cp /src/build-wasm/scoreview.lib.js /src/build-wasm/scoreview.lib.wasm /src/build-wasm/scoreview.lib.data /src/web-public/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle JS wrapper
        working-directory: web-public
        run: |
          npm ci
          npm run build

      - name: Download native corpus report
        uses: actions/download-artifact@v4
        with:
          name: corpus-native

      - name: Corpus under Node
        run: |
          node tools/corpus-node.cjs --out corpus-node.json
          python3 tools/corpus-compare.py corpus-native.json corpus-node.json --exact-svg \
            --waivers testdata/corpus-wasm-waivers.json

      - name: Pack npm tarball
        working-directory: web-public
        run: npm pack

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack
          path: web-public/scoreview-engine-*.tgz

  # Distribution through GitHub Releases only (like the webmscore fork):
  # a push to main whose commit message starts with "release v<tag>" creates
  # the release and attaches the corpus-gated tarball from this same run.
  publish:
    if: github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'release v')
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-pack

      - name: Version from commit message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | head -1 | cut -d ' ' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: scoreview-engine-*.tgz
          name: scoreview-engine ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
